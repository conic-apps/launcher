[package]
name = "conic-ui"
description = "The Slint interface of Conic Launcher"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The generated Slint module is too large to compile a second time for a test
# harness on a 16 GB runner, and this crate has no unit tests. `--all-targets`
# selects the harness regardless, so CI excludes this crate as well.
test = false

[build-dependencies]
slint-build.workspace = true
usvg.workspace = true

[dependencies]
slint = { workspace = true, features = ["image-default-formats"] }
