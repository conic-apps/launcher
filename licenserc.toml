# HawkEye configuration for the source-file SPDX headers. CI runs
# `hawkeye check`, and `hawkeye format` writes any missing header, so the two
# never drift. Only the extensions below carry a header: the manifests, the
# `.po` catalogues and the generated `icons.slint` deliberately do not, and are
# left out of `includes` rather than listed as exclusions.
#
# The header text is the exact three lines every source file already starts
# with after its shebang. HawkEye supplies the comment markers per extension
# from its built-in rules, so the same template comes out as `// ` for Rust and
# Slint and as `# ` for the Python and shell tools.

[header]
text = """
Conic Launcher
Copyright 2022-2026 ConicMC developers. All rights reserved.
SPDX-License-Identifier: GPL-3.0-only
"""

[files]
root = "{{ config_dir }}"
includes = ["**/*.rs", "**/*.slint", "**/*.py", "**/*.sh"] # NOTE: .ps1 file is unsupported.
excludes = ["target/**"]

# `.slint` is not in HawkEye's built-in extension table, so without this rule
# the header check would silently skip every Slint file.
[[rules]]
extensions = ["slint"]
style_out = "doubleslash"
styles_in = ["doubleslash"]
