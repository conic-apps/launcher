name: Check Rust

on:
  push:
    paths:
      - ".github/workflows/check-rust.yml"
      - "crates/**"
      - "app/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: ["master"]
    paths:
      - ".github/workflows/check-rust.yml"
      - "crates/**"
      - "app/**"
      - "Cargo.toml"
      - "Cargo.lock"
env:
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0 # This would add unnecessary bloat to the target folder, decreasing cache efficiency.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    strategy:
      matrix:
        include:
          - platform: "ubuntu-latest"
          - platform: "windows-latest"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # The Slint/winit stack. `cargo check` reaches `fontique`, `alsa-sys` and
      # `libudev-sys`, whose build scripts each shell out to `pkg-config` for a
      # development package — so these are build dependencies of the *check*, not
      # only of a release build.
      #
      # `webkit2gtk-4.1` and `libayatana-appindicator3-dev` were here for Tauri.
      # There is no webview and no tray plugin in the tree any more, and installing
      # them did nothing but slow the job down.
      - name: install dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libasound2-dev libudev-dev

      - name: install Rust stable with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run cargo check
        run: cargo check

      - name: Run clippy
        run: cargo clippy --manifest-path ./Cargo.toml --all-targets --release -- -D warnings

  test:
    strategy:
      matrix:
        include:
          - platform: "ubuntu-latest"
          - platform: "windows-latest"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # Same three development packages as the clippy job, and for the same
      # reason. Without them the job fails in `cargo build.rs` long before it
      # reaches the tests.
      - name: install dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libasound2-dev libudev-dev

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run cargo test
        run: cargo check --all --release --verbose --all-targets