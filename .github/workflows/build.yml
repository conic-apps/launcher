name: Conic Launcher Auto Build
on:
  workflow_dispatch:
    branches:
      - dev
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "app/Cargo.toml"
      - "packaging/**"
      - "tools/package-linux.sh"
      - "tools/package-macos.sh"
      - "tools/package-windows.ps1"
      - "tools/dmg-ds-store.py"
      - "tools/generate-icons.py"
      - "tools/generate-ico.py"
  push:
    branches:
      - dev

jobs:
  get-version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Get app version
        id: current_version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' app/Cargo.toml | head -1)"
          test -n "$version" || { echo "no version in app/Cargo.toml" >&2; exit 1; }
          echo "text=$version" >> "$GITHUB_OUTPUT"

      - name: Get previous version
        id: previous_version
        run: |
          echo "text=$(git show HEAD~1:app/Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)" >> $GITHUB_OUTPUT
    outputs:
      app_version: ${{ steps.current_version.outputs.text }}
      previous_app_version: ${{ steps.previous_version.outputs.text }}

  build-linux:
    needs: [get-version]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            rpm: "x86_64"
            deb: "amd64"
            appimage: "x86_64"
          - platform: "ubuntu-22.04-arm"
            rpm: "aarch64"
            deb: "arm64"
            appimage: "aarch64"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # The Slint/winit stack. None of these are declared anywhere in the
      # build, so a missing one only shows up as a link error deep in a release
      # build:
      #   pkg-config          — all three build scripts below go through it
      #   libfontconfig1-dev  — `fontique` -> `yeslogic-fontconfig-sys`
      #   libasound2-dev      — `alsa-sys`, via `cpal` in the music player
      #   libudev-dev         — `libudev-sys`, via `i-slint-backend-linuxkms`
      # GL, xkbcommon and the X11 libraries are `dlopen`ed by glutin, winit and
      # Skia rather than linked, so they are runtime dependencies of the package
      # and not build dependencies of the crate.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates pkg-config \
            libfontconfig1-dev libasound2-dev libudev-dev \
            dpkg-dev rpm file desktop-file-utils

      # `dpkg-dev` is separate from `dpkg`: it is what provides `dpkg-shlibdeps`,
      # and without it `depends = "$auto"` resolves to nothing *silently* — the
      # package builds and is then missing every shared library it needs.

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # `taiki-e/install-action` only knows how to *download a release binary*,
      # and `cargo-rpm` publishes no such binary -- it has to be compiled. So both
      # of these are `cargo install`, into the toolchain directory that is already
      # on `PATH` from the step above.
      #
      # `--locked` in both: `cargo-rpm` builds `abscissa_core 0.5`, which still
      # emits `future-incompat` warnings on current stable, and without the
      # lockfile it can also fail outright when one of its transitive
      # dependencies needs a newer rustc than the runner has.
      - name: install cargo-deb and cargo-rpm
        run: |
          cargo install --locked cargo-deb cargo-rpm
          # Verified through the *subcommand*, not `--version`: `cargo rpm`
          # passes its flags to abscissa, and abscissa does not know `--version`,
          # so `cargo rpm --version` exits 1 and takes the whole step with it.
          # `cargo rpm version` is its actual version subcommand.
          cargo deb --version
          cargo rpm version

      # `appimagetool` is an AppImage itself, so installing it is three steps
      # rather than one:
      #   1. download the continuous build for this runner's architecture,
      #   2. neutralise its magic bytes so the kernel will not try to run it as
      #      an ELF (`AI\x02` -> three NULs),
      #   3. chmod it.
      # Step 2 is the documented workaround and is what the upstream README
      # tells you to do; without it `file` reports a broken AppImage and
      # appimagetool refuses to start.
      - name: install appimagetool
        run: |
          curl -sSfL \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-$(uname -m).AppImage" \
            -o /usr/local/bin/appimagetool
          sed -i 's|AI\x02|\x00\x00\x00|' /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool

      - name: Validate the desktop entry
        run: desktop-file-validate packaging/linux/conic-launcher.desktop

      # The one build step. `tools/package-linux.sh` assembles the `.deb` with
      # `cargo deb`, the `.rpm` with `cargo rpm`, and the AppDir it hands to
      # `appimagetool`, then leaves everything in `target/package/`.
      - name: Build the packages
        env:
          # Signs the AppImage and the portable tarball with the same minisign
          # key the app verifies against (`crates/update`). Unset just leaves
          # the bundles unsigned, which the updater then refuses.
          CONIC_UPDATE_SIGNING_KEY: ${{ secrets.CONIC_UPDATE_SIGNING_KEY }}
          CONIC_UPDATE_SIGNING_KEY_PASSWORD: ${{ secrets.CONIC_UPDATE_SIGNING_KEY_PASSWORD }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          # `APPIMAGE_EXTRACT_AND_RUN=1` because a runner cannot mount a squashfs
          # image without FUSE. It affects this step only; the artifact still
          # mounts normally for whoever downloads it.
          APPIMAGE_EXTRACT_AND_RUN=1 tools/package-linux.sh

      - name: Show what was produced
        run: ls -lh target/package/

      - name: Inspect the deb
        run: |
          # Not a smoke test — a check that the three things a broken packaging
          # run gets wrong are actually in the archive: the control metadata, the
          # executable's mode, and the payload the desktop entry depends on.
          deb=$(ls target/package/*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          dpkg-deb --field "$deb" Depends

      - name: Inspect the rpm
        run: |
          # `Requires` here is rpmbuild's automatic dependency generator, not
          # something written down anywhere — if the ELF's `NEEDED` entries stop
          # resolving, this is where it shows.
          rpm=$(ls target/package/*.rpm)
          rpm -qip "$rpm"
          rpm -qlvp "$rpm"

      - name: Upload deb bundle
        uses: actions/upload-artifact@v7
        with:
          name: Debian bundle(${{ matrix.deb }})
          path: ${{ github.workspace }}/target/package/*.deb

      - name: Upload rpm bundle
        uses: actions/upload-artifact@v7
        with:
          name: RPM bundle(${{ matrix.rpm }})
          path: ${{ github.workspace }}/target/package/*.rpm

      # The AppImage is the self-updatable Linux bundle; its `.sig` and the
      # portable tarball beside it are what the update server indexes.
      - name: Upload appimage bundle
        uses: actions/upload-artifact@v7
        with:
          name: AppImage bundle(${{ matrix.appimage }})
          path: |
            ${{ github.workspace }}/target/package/*.AppImage
            ${{ github.workspace }}/target/package/*.AppImage.sig
            ${{ github.workspace }}/target/package/*.tar.gz
            ${{ github.workspace }}/target/package/*.tar.gz.sig

  # One job per architecture, each building natively on its own runner.
  #
  # A single Apple Silicon runner with `rustup target add x86_64-apple-darwin`
  # plus `lipo` would produce one universal `.dmg` instead of two, which is
  # tidier for a user. It is not worth it, for reasons this project has already
  # paid for:
  #
  #   * A cross-compiled x86_64 slice is *linked*, never *run*. Nothing in CI
  #     launches it, so an x86_64-only runtime fault ships uncaught. A native
  #     runner at least executes the build script and the test suite there.
  #   * The compiler is not the only thing that has to be cross-configured. Skia
  #     is built from source through `cc`, and `aws-lc-rs` likewise; a
  #     host-arch `cc` in a `--target` build produces a subtly wrong binary
  #     rather than an error. Native runners cannot get that wrong.
  #
  # Two thin images, each of which was built *on* the architecture it runs on.
  # `--universal` is still available locally for a hand-built single image.
  build-macos:
    needs: [get-version]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26"
            arch: "arm64"
          - platform: "macos-26-intel"
            arch: "x86_64"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # No `--target` and no `--universal`: the runner *is* the architecture, so
      # `package-macos.sh` builds exactly what this machine can run. It reads the
      # architecture out of `rustc -vV` and names the image after it, so the two
      # jobs produce `…-arm64.dmg` and `…-x86_64.dmg`.
      - name: Build the .app and the .dmg
        env:
          CONIC_UPDATE_SIGNING_KEY: ${{ secrets.CONIC_UPDATE_SIGNING_KEY }}
          CONIC_UPDATE_SIGNING_KEY_PASSWORD: ${{ secrets.CONIC_UPDATE_SIGNING_KEY_PASSWORD }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: tools/package-macos.sh

      - name: Inspect the app
        run: |
          app=target/package/conic-launcher.app
          echo "### the bundle"
          find "$app" | sed "s|$app|.|" | sort
          echo "### Info.plist"
          for key in CFBundleIdentifier CFBundleName CFBundleExecutable \
                     CFBundleShortVersionString CFBundleVersion \
                     LSMinimumSystemVersion LSApplicationCategoryType; do
            printf '  %-26s %s\n' "$key" "$(/usr/libexec/PlistBuddy -c "Print :$key" "$app/Contents/Info.plist")"
          done
          echo "### architecture"
          # Thin and native, which is the point of the matrix. A universal binary
          # here would mean this job had silently cross-compiled.
          lipo -info "$app/Contents/MacOS/conic-launcher"
          echo "### signature"
          # Ad-hoc (`codesign -s -`), which is what makes an arm64 binary
          # executable at all. NOT a Developer ID signature, so Gatekeeper will
          # block the app on another user's machine and they have to clear the
          # quarantine flag themselves; that needs a certificate and notarization
          # credentials this workflow does not have.
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E "Identifier|Format|Signature|TeamIdentifier"

      - name: Upload the app bundle
        uses: actions/upload-artifact@v7
        with:
          name: macOS app bundle(${{ matrix.arch }})
          # Zipped rather than a bare `.app`, because an artifact upload turns a
          # directory into a file on its own and the symlinks inside the bundle
          # need the archiver to preserve them.
          path: ${{ github.workspace }}/target/package/conic-launcher.app

      - name: Upload the dmg
        uses: actions/upload-artifact@v7
        with:
          name: macOS disk image(${{ matrix.arch }})
          path: ${{ github.workspace }}/target/package/*.dmg

      # The tarball of the bundle, which is what the self-updater downloads and
      # unpacks, plus its minisign signature.
      - name: Upload the updater bundle
        uses: actions/upload-artifact@v7
        with:
          name: macOS updater bundle(${{ matrix.arch }})
          path: |
            ${{ github.workspace }}/target/package/*.app.tar.gz
            ${{ github.workspace }}/target/package/*.app.tar.gz.sig

  # One job per architecture, each building natively on its own runner, and for
  # the same reasons `build-macos` gives: a `--target` build compiles for the guest
  # while running every build script on the host, so Skia and `aws-lc-rs` — both
  # built through `cc` — come out subtly wrong rather than failing, and nothing in
  # CI would ever run a cross-compiled slice. A native runner at least executes the
  # build script and the MSI install there.
  build-windows:
    needs: [get-version]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both labels spelled out rather than `windows-latest`: `latest` is a
          # moveable target, and the ARM64 one has no `latest` spelling at all. The
          # Rust targets are `x86_64-pc-windows-msvc` and `aarch64-pc-windows-msvc`,
          # and neither is ever passed to cargo — the runner *is* the architecture,
          # which is the point of one job per architecture here.
          - platform: "windows-2025"
            arch: "x64"
          - platform: "windows-11-arm"
            arch: "arm64"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # No dependency install step, unlike the Linux job: the Slint/winit stack
      # needs `pkg-config`, `libfontconfig1-dev`, `libasound2-dev` and
      # `libudev-dev`, none of which exist here. What a Windows build does need is
      # already in the image — Visual Studio's C++ toolset and the Windows SDK for
      # `cc`, and prebuilt Skia binaries from `skia-bindings`' `binary-cache`,
      # which has `aarch64-pc-windows-msvc` releases.
      #
      # WiX is the one thing not in the image, and it is installed as a .NET tool
      # (v6, `dotnet tool install`) rather than taken from the image, for three
      # reasons:
      #   * `windows-11-arm` has no WiX at all, so the v3 toolset would need a
      #     separate install path for one of the two jobs anyway,
      #   * WiX v3 is EOL, and its `candle`/`light` pair reads a *different* XML
      #     dialect rather than an older spelling of the v4+ one the `.wxs` is
      #     written in, so both toolsets cannot be kept in step from one file,
      #   * the version is then the same on both runners, which is what makes one
      #     `.wxs` and one script produce two packages.
      # Pinned rather than floating: an installer that builds on one week and not
      # the next is not a reproducible release.
      - name: install the WiX toolset
        shell: pwsh
        run: |
          # `--tool-path` rather than `--global`, so the tool lands in the checkout
          # and the job does not depend on the image's `%USERPROFILE%\.dotnet\tools`
          # being on PATH.
          New-Item -ItemType Directory -Force .\.tools | Out-Null
          dotnet tool install --tool-path .\.tools wix --version 6.0.2
          # The dialogs are a *separate* package, into the per-user extension cache
          # that `wix build -ext` reads. Without it the MSI builds and installs
          # with no interface at all — a window that flashes and an install that
          # happens behind it — so a missing extension is not a build failure.
          .\.tools\wix.exe extension add -g WixToolset.UI.wixext/6.0.2
          .\.tools\wix.exe extension list -g
          .\.tools\wix.exe --version
          ".\.tools" | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build the .exe and the .msi
        env:
          # Read at compile time by `crates/curseforge/build.rs`; unset just means
          # the official CurseForge API is unauthenticated.
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          # Signs the portable exe and the MSI for the self-updater.
          CONIC_UPDATE_SIGNING_KEY: ${{ secrets.CONIC_UPDATE_SIGNING_KEY }}
          CONIC_UPDATE_SIGNING_KEY_PASSWORD: ${{ secrets.CONIC_UPDATE_SIGNING_KEY_PASSWORD }}
        run: tools/package-windows.ps1

      - name: Inspect the msi
        shell: pwsh
        run: |
          # Not a smoke test — a check that the things a broken packaging run gets
          # wrong are actually in the package: the version split (an MSI cannot
          # hold `0.1.0-alpha.2`), the identity (a `ProductCode` WiX would have
          # invented, which cannot be repaired or upgraded), the icon (a `PNG` in
          # the `Icon` table, which Windows Installer cannot draw), and the folder
          # the shortcut points into.
          $msi = @(Get-ChildItem target/package/*.msi)
          if ($msi.Count -ne 1) { throw "expected one .msi, found $($msi.Count)" }
          # The name `package-windows.ps1` builds: `conic-launcher_<version>_<arch>_en-US.msi`,
          # with the architecture and the locale the update server's asset table
          # matches. It is not the `.dmg`'s `-<arch>` tail.
          if ($msi.Name -notlike "*_${{ matrix.arch }}_en-US.msi") {
            throw "$($msi.Name) is not named for ${{ matrix.arch }}"
          }
          Write-Host "### $($msi.Name) ($('{0:N1} MiB' -f ($msi.Length / 1MB)))"

          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.OpenDatabase($msi.FullName, 0)
          function Query([string]$Sql, [int]$Columns) {
            $view = $db.OpenView($Sql)
            $view.Execute()
            while ($record = $view.Fetch()) {
              $fields = for ($i = 1; $i -le $Columns; $i++) { $record.StringData($i) }
              "  " + ($fields -join ' | ')
            }
          }

          Write-Host "### properties"
          Query "SELECT Property, Value FROM Property" 2 |
            Where-Object { $_ -match 'Product|Upgrade|ARP|ALLUSERS' }
          Write-Host "### files"
          Query "SELECT FileName FROM File" 1
          Write-Host "### icon"
          # One row, or `ARPPRODUCTICON` points at nothing and Add/Remove Programs
          # shows the default icon.
          Query "SELECT Name FROM Icon" 1
          Write-Host "### folders"
          Query "SELECT Directory, Directory_Parent FROM Directory" 2
          Write-Host "### summary"
          $summary = $db.SummaryInformation(0)
          # 3 = Subject, 4 = Author, 14 = the Windows Installer version required.
          foreach ($property in 3, 4, 14) { "  $property = $($summary.Property($property))" }

      # An MSI that builds is not an MSI that installs, and the two failures are
      # different: `wix` validates the XML against its schema, `msiexec` is the one
      # that refuses a package the machine's processor type does not support, a
      # component with no key path, or a folder that cannot be written. That last
      # one is why this is an install and not just a table read.
      #
      # It also installs the app's own `.exe` on the runner, which is the only check
      # in this workflow that the packaged binary is the one that was built.
      - name: Install the msi and uninstall it again
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem target/package/*.msi)[0].FullName
          $log = Join-Path $env:RUNNER_TEMP 'install.log'
          # `WaitForExit(ms)` rather than `-Wait`: an msiexec that never returns would sit
          # here until the job is killed hours later, with its log unread. Three
          # minutes is orders of magnitude more than the install needs -- it takes
          # about a second and a half on a runner.
          $process = Start-Process msiexec `
            -ArgumentList '/i', "`"$msi`"", '/qn', '/L*v', "`"$log`"" -PassThru
          if (-not $process.WaitForExit(180000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Content $log -Tail 40
            throw 'msiexec /i is still running after 3 minutes'
          }
          if ($process.ExitCode -ne 0) {
            Get-Content $log -Tail 60
            throw "msiexec /i exited $($process.ExitCode)"
          }

          $installed = Join-Path $env:ProgramFiles 'Conic Launcher'
          $exe = Join-Path $installed 'conic-launcher.exe'
          if (-not (Test-Path $exe)) { throw "$exe is missing after the install" }
          $license = Join-Path $installed 'LICENSE'
          if (-not (Test-Path $license)) { throw "$license is missing after the install" }
          Write-Host "installed to $installed"
          # The Start menu shortcut, which is the one thing the `.wxs` authors by
          # hand and nothing above has checked exists.
          $shortcut = Join-Path $env:ProgramData `
            'Microsoft\Windows\Start Menu\Programs\Conic Launcher\Conic Launcher.lnk'
          if (-not (Test-Path $shortcut)) { throw "$shortcut is missing after the install" }

          $process = Start-Process msiexec `
            -ArgumentList '/x', "`"$msi`"", '/qn', '/L*v', "`"$log`"" -PassThru
          if (-not $process.WaitForExit(180000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Get-Content $log -Tail 40
            throw 'msiexec /x is still running after 3 minutes'
          }
          if ($process.ExitCode -ne 0) {
            Get-Content $log -Tail 60
            throw "msiexec /x exited $($process.ExitCode)"
          }
          if (Test-Path $exe) { throw "$exe survived the uninstall" }
          Write-Host "uninstalled cleanly"

      - name: Upload the msi
        uses: actions/upload-artifact@v7
        with:
          name: Windows installer(${{ matrix.arch }})
          path: |
            ${{ github.workspace }}/target/package/*.msi
            ${{ github.workspace }}/target/package/*.msi.sig
          if-no-files-found: error

      # The portable executable and its signature, archived together because the
      # download step extracts them under their own names either way.
      - name: Upload the exe
        uses: actions/upload-artifact@v7
        with:
          name: Windows portable(${{ matrix.arch }})
          path: |
            ${{ github.workspace }}/target/package/*.exe
            ${{ github.workspace }}/target/package/*.exe.sig
          if-no-files-found: error

  release:
    needs: [build-linux, build-macos, build-windows, get-version]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && needs.get-version.outputs.app_version != needs.get-version.outputs.previous_app_version
    steps:
      - uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./release_files

      - name: Detect prerelease
        id: detect
        run: |
          if [[ "${{ needs.get-version.outputs.app_version }}" == *"alpha"* || "${{ needs.get-version.outputs.app_version }}" == *"beta"* || "${{ needs.get-version.outputs.app_version }}" == *"rc"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        id: drafter
        uses: release-drafter/release-drafter@v7
        with:
          version: ${{ needs.get-version.outputs.app_version }}
          prerelease: ${{ steps.detect.outputs.is_prerelease }}
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: v${{ needs.get-version.outputs.app_version }}
        run: |
          # Skip the decomposed macOS app bundle: uploading it as an artifact
          # decomposes it, and its internal files (Info.plist, CodeResources,
          # the raw binary, etc.) would otherwise leak into the Release.
          find ./release_files -type f ! -path '*/Contents/*' -print0 | while IFS= read -r -d '' file; do
            echo "Uploading $file to release $TAG_NAME"
            gh release upload "$TAG_NAME" "$file" --clobber --repo conic-apps/launcher
          done
