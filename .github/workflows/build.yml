name: Conic Launcher Auto Build
on:
  workflow_dispatch:
    branches:
      - dev
  pull_request:
    # Not every pull request: a release build is `lto = true` with
    # `codegen-units = 1`, so building one to check a Rust change is expensive.
    # What must not slip through unbuilt is a change to *how the packages are
    # made* — the payload, the recipe, the packaging metadata or the script —
    # because nothing else would notice it breaking.
    paths:
      - ".github/workflows/build.yml"
      - "app/Cargo.toml"
      - "packaging/**"
      - "tools/package-linux.sh"
      - "tools/generate-icons.py"
  push:
    branches:
      - master
      # The Tauri removal is in review here, and its packaging cannot be tested
      # without a run. Temporary: drop this when the branch merges.
      - RIP-Tauri

jobs:
  get-version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # `app/Cargo.toml` is the only place the version lives now. It was
      # `core/tauri.conf.json` before the Slint migration, and this job spent a
      # long time after that reading a file that no longer exists.
      - name: Get app version
        id: current_version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' app/Cargo.toml | head -1)"
          test -n "$version" || { echo "no version in app/Cargo.toml" >&2; exit 1; }
          echo "text=$version" >> "$GITHUB_OUTPUT"

      - name: Get previous version
        id: previous_version
        run: |
          echo "text=$(git show HEAD~1:app/Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)" >> $GITHUB_OUTPUT
    outputs:
      app_version: ${{ steps.current_version.outputs.text }}
      previous_app_version: ${{ steps.previous_version.outputs.text }}

  build-linux:
    needs: [get-version]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            rpm: "x86_64"
            deb: "amd64"
            appimage: "x86_64"
          - platform: "ubuntu-22.04-arm"
            rpm: "aarch64"
            deb: "arm64"
            appimage: "aarch64"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # The Slint/winit stack, not the Tauri/webview one this list used to
      # install. None of these are declared anywhere in the build, so a missing
      # one only shows up as a link error deep in a release build:
      #   pkg-config          — all three build scripts below go through it
      #   libfontconfig1-dev  — `fontique` -> `yeslogic-fontconfig-sys`
      #   libasound2-dev      — `alsa-sys`, via `cpal` in the music player
      #   libudev-dev         — `libudev-sys`, via `i-slint-backend-linuxkms`
      # GL, xkbcommon and the X11 libraries are `dlopen`ed by glutin, winit and
      # Skia rather than linked, so they are runtime dependencies of the package
      # and not build dependencies of the crate.
      #
      # `webkit2gtk-4.1` and `libappindicator3-dev` were here for Tauri. There is
      # no webview and no tray plugin any more.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates pkg-config \
            libfontconfig1-dev libasound2-dev libudev-dev \
            dpkg-dev rpm file desktop-file-utils

      # `dpkg-dev` is separate from `dpkg`: it is what provides `dpkg-shlibdeps`,
      # and without it `depends = "$auto"` resolves to nothing *silently* — the
      # package builds and is then missing every shared library it needs.

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # `taiki-e/install-action` only knows how to *download a release binary*,
      # and `cargo-rpm` publishes no such binary -- it has to be compiled. So both
      # of these are `cargo install`, into the toolchain directory that is already
      # on `PATH` from the step above.
      #
      # `--locked` in both: `cargo-rpm` builds `abscissa_core 0.5`, which still
      # emits `future-incompat` warnings on current stable, and without the
      # lockfile it can also fail outright when one of its transitive
      # dependencies needs a newer rustc than the runner has.
      - name: install cargo-deb and cargo-rpm
        run: |
          cargo install --locked cargo-deb cargo-rpm
          # Verified through the *subcommand*, not `--version`: `cargo rpm`
          # passes its flags to abscissa, and abscissa does not know `--version`,
          # so `cargo rpm --version` exits 1 and takes the whole step with it.
          # `cargo rpm version` is its actual version subcommand.
          cargo deb --version
          cargo rpm version

      # `appimagetool` is an AppImage itself, so installing it is three steps
      # rather than one:
      #   1. download the continuous build for this runner's architecture,
      #   2. neutralise its magic bytes so the kernel will not try to run it as
      #      an ELF (`AI\x02` -> three NULs),
      #   3. chmod it.
      # Step 2 is the documented workaround and is what the upstream README
      # tells you to do; without it `file` reports a broken AppImage and
      # appimagetool refuses to start.
      - name: install appimagetool
        run: |
          curl -sSfL \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-$(uname -m).AppImage" \
            -o /usr/local/bin/appimagetool
          sed -i 's|AI\x02|\x00\x00\x00|' /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool

      - name: Validate the desktop entry
        run: desktop-file-validate packaging/linux/conic-launcher.desktop

      # The one build step. `tools/package-linux.sh` assembles the `.deb` with
      # `cargo deb`, the `.rpm` with `cargo rpm`, and the AppDir it hands to
      # `appimagetool`, then leaves everything in `target/package/`.
      - name: Build the packages
        env:
          # The Tauri's `TAURI_SIGNING_PRIVATE_KEY` pair is gone with the
          # updater: the Slint app has no self-update, so there is nothing to
          # sign and no `.sig` artifact to upload.
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          # `APPIMAGE_EXTRACT_AND_RUN=1` because a runner cannot mount a squashfs
          # image without FUSE. It affects this step only; the artifact still
          # mounts normally for whoever downloads it.
          APPIMAGE_EXTRACT_AND_RUN=1 tools/package-linux.sh

      - name: Show what was produced
        run: ls -lh target/package/

      - name: Inspect the deb
        run: |
          # Not a smoke test — a check that the three things a broken packaging
          # run gets wrong are actually in the archive: the control metadata, the
          # executable's mode, and the payload the desktop entry depends on.
          deb=$(ls target/package/*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          dpkg-deb --field "$deb" Depends

      - name: Inspect the rpm
        run: |
          # `Requires` here is rpmbuild's automatic dependency generator, not
          # something written down anywhere — if the ELF's `NEEDED` entries stop
          # resolving, this is where it shows.
          rpm=$(ls target/package/*.rpm)
          rpm -qip "$rpm"
          rpm -qlvp "$rpm"

      - name: Upload deb bundle
        uses: actions/upload-artifact@v7
        with:
          name: Debian bundle(${{ matrix.deb }})
          path: ${{ github.workspace }}/target/package/*.deb

      - name: Upload rpm bundle
        uses: actions/upload-artifact@v7
        with:
          name: RPM bundle(${{ matrix.rpm }})
          path: ${{ github.workspace }}/target/package/*.rpm

      - name: Upload appimage bundle
        uses: actions/upload-artifact@v7
        with:
          name: AppImage bundle(${{ matrix.appimage }})
          path: ${{ github.workspace }}/target/package/*.AppImage

  # One job per architecture, each building natively on its own runner.
  #
  # A single Apple Silicon runner with `rustup target add x86_64-apple-darwin`
  # plus `lipo` would produce one universal `.dmg` instead of two, which is
  # tidier for a user. It is not worth it, for reasons this project has already
  # paid for:
  #
  #   * A cross-compiled x86_64 slice is *linked*, never *run*. Nothing in CI
  #     launches it, so an x86_64-only runtime fault ships uncaught. A native
  #     runner at least executes the build script and the test suite there.
  #   * The compiler is not the only thing that has to be cross-configured. Skia
  #     is built from source through `cc`, and `aws-lc-rs` likewise; a
  #     host-arch `cc` in a `--target` build produces a subtly wrong binary
  #     rather than an error. Native runners cannot get that wrong.
  #   * `macos-15-intel` exists and is the last x86_64 image GitHub will offer
  #     (retiring after the macOS 15 image, in Fall 2027), so this is the window
  #     in which native Intel builds are available at all.
  #
  # Two thin images, each of which was built *on* the architecture it runs on.
  # `--universal` is still available locally for a hand-built single image.
  build-macos:
    needs: [get-version]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-15"
            arch: "arm64"
          - platform: "macos-15-intel"
            arch: "x86_64"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # No `--target` and no `--universal`: the runner *is* the architecture, so
      # `package-macos.sh` builds exactly what this machine can run. It reads the
      # architecture out of `rustc -vV` and names the image after it, so the two
      # jobs produce `…-arm64.dmg` and `…-x86_64.dmg`.
      - name: Build the .app and the .dmg
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: tools/package-macos.sh

      - name: Inspect the app
        run: |
          app=target/package/conic-launcher.app
          echo "### the bundle"
          find "$app" | sed "s|$app|.|" | sort
          echo "### Info.plist"
          for key in CFBundleIdentifier CFBundleName CFBundleExecutable \
                     CFBundleShortVersionString CFBundleVersion \
                     LSMinimumSystemVersion LSApplicationCategoryType; do
            printf '  %-26s %s\n' "$key" "$(/usr/libexec/PlistBuddy -c "Print :$key" "$app/Contents/Info.plist")"
          done
          echo "### architecture"
          # Thin and native, which is the point of the matrix. A universal binary
          # here would mean this job had silently cross-compiled.
          lipo -info "$app/Contents/MacOS/conic-launcher"
          echo "### signature"
          # Ad-hoc (`codesign -s -`), which is what makes an arm64 binary
          # executable at all. NOT a Developer ID signature, so Gatekeeper will
          # block the app on another user's machine and they have to clear the
          # quarantine flag themselves; that needs a certificate and notarization
          # credentials this workflow does not have.
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E "Identifier|Format|Signature|TeamIdentifier"

      - name: Upload the app bundle
        uses: actions/upload-artifact@v7
        with:
          name: macOS app bundle(${{ matrix.arch }})
          # Zipped rather than a bare `.app`, because an artifact upload turns a
          # directory into a file on its own and the symlinks inside the bundle
          # need the archiver to preserve them.
          path: ${{ github.workspace }}/target/package/conic-launcher.app

      - name: Upload the dmg
        uses: actions/upload-artifact@v7
        with:
          name: macOS disk image(${{ matrix.arch }})
          path: ${{ github.workspace }}/target/package/*.dmg

  release:
    needs: [build-linux, build-macos, get-version]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && needs.get-version.outputs.app_version != needs.get-version.outputs.previous_app_version
    steps:
      - uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./release_files

      - name: Detect prerelease
        id: detect
        run: |
          if [[ "${{ needs.get-version.outputs.app_version }}" == *"alpha"* || "${{ needs.get-version.outputs.app_version }}" == *"beta"* || "${{ needs.get-version.outputs.app_version }}" == *"rc"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        id: drafter
        uses: release-drafter/release-drafter@v7
        with:
          version: ${{ needs.get-version.outputs.app_version }}
          prerelease: ${{ steps.detect.outputs.is_prerelease }}
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./release_files

      - name: Upload files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: v${{ needs.get-version.outputs.app_version }}
        run: |
          find ./release_files -type f -print0 | while IFS= read -r -d '' file; do
            echo "Uploading $file to release $TAG_NAME"
            gh release upload "$TAG_NAME" "$file" --clobber --repo conic-apps/launcher
          done
