name: Conic Launcher Auto Build
on:
  workflow_dispatch:
    branches:
      - dev
  pull_request:
    # Not every pull request: a release build is `lto = true` with
    # `codegen-units = 1`, so building one to check a Rust change is expensive.
    # What must not slip through unbuilt is a change to *how the packages are
    # made* — the payload, the recipe, the packaging metadata or the script —
    # because nothing else would notice it breaking.
    paths:
      - ".github/workflows/build.yml"
      - "app/Cargo.toml"
      - "packaging/**"
      - "tools/package-linux.sh"
      - "tools/generate-icons.py"
  push:
    branches:
      - master

jobs:
  get-version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # `app/Cargo.toml` is the only place the version lives now. It was
      # `core/tauri.conf.json` before the Slint migration, and this job spent a
      # long time after that reading a file that no longer exists.
      - name: Get app version
        id: current_version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' app/Cargo.toml | head -1)"
          test -n "$version" || { echo "no version in app/Cargo.toml" >&2; exit 1; }
          echo "text=$version" >> "$GITHUB_OUTPUT"

      - name: Get previous version
        id: previous_version
        run: |
          echo "text=$(git show HEAD~1:app/Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)" >> $GITHUB_OUTPUT
    outputs:
      app_version: ${{ steps.current_version.outputs.text }}
      previous_app_version: ${{ steps.previous_version.outputs.text }}

  build:
    needs: [get-version]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # `deb`/`rpm` architecture names on the left, Rust targets derived by
          # the runner itself on the right. The runner *is* the target: both jobs
          # build natively, so there is no cross-compilation sysroot to keep in
          # step with the host.
          - platform: "ubuntu-22.04"
            rpm: "x86_64"
            deb: "amd64"
            appimage: "x86_64"

          - platform: "ubuntu-22.04-arm"
            rpm: "aarch64"
            deb: "arm64"
            appimage: "aarch64"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # The Slint/winit stack, not the Tauri/webview one this list used to
      # install. None of these are declared anywhere in the build, so a missing
      # one only shows up as a link error deep in a release build:
      #   pkg-config          — all three build scripts below go through it
      #   libfontconfig1-dev  — `fontique` -> `yeslogic-fontconfig-sys`
      #   libasound2-dev      — `alsa-sys`, via `cpal` in the music player
      #   libudev-dev         — `libudev-sys`, via `i-slint-backend-linuxkms`
      # GL, xkbcommon and the X11 libraries are `dlopen`ed by glutin, winit and
      # Skia rather than linked, so they are runtime dependencies of the package
      # and not build dependencies of the crate.
      #
      # `webkit2gtk-4.1` and `libappindicator3-dev` were here for Tauri. There is
      # no webview and no tray plugin any more.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates pkg-config \
            libfontconfig1-dev libasound2-dev libudev-dev \
            dpkg-dev rpm file desktop-file-utils

      # `dpkg-dev` is separate from `dpkg`: it is what provides `dpkg-shlibdeps`,
      # and without it `depends = "$auto"` resolves to nothing *silently* — the
      # package builds and is then missing every shared library it needs.

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: install cargo-deb
        uses: taiki-e/install-action@cargo-deb

      - name: install cargo-rpm
        uses: taiki-e/install-action@cargo-rpm

      # `appimagetool` is an AppImage itself, so installing it is three steps
      # rather than one:
      #   1. download the continuous build for this runner's architecture,
      #   2. neutralise its magic bytes so the kernel will not try to run it as
      #      an ELF (`AI\x02` -> three NULs),
      #   3. chmod it.
      # Step 2 is the documented workaround and is what the upstream README
      # tells you to do; without it `file` reports a broken AppImage and
      # appimagetool refuses to start.
      - name: install appimagetool
        run: |
          curl -sSfL \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-$(uname -m).AppImage" \
            -o /usr/local/bin/appimagetool
          sed -i 's|AI\x02|\x00\x00\x00|' /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool

      - name: Validate the desktop entry
        run: desktop-file-validate packaging/linux/conic-launcher.desktop

      # The one build step. `tools/package-linux.sh` assembles the `.deb` with
      # `cargo deb`, the `.rpm` with `cargo rpm`, and the AppDir it hands to
      # `appimagetool`, then leaves everything in `target/package/`.
      - name: Build the packages
        env:
          # The Tauri's `TAURI_SIGNING_PRIVATE_KEY` pair is gone with the
          # updater: the Slint app has no self-update, so there is nothing to
          # sign and no `.sig` artifact to upload.
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          # `APPIMAGE_EXTRACT_AND_RUN=1` because a runner cannot mount a squashfs
          # image without FUSE. It affects this step only; the artifact still
          # mounts normally for whoever downloads it.
          APPIMAGE_EXTRACT_AND_RUN=1 tools/package-linux.sh

      - name: Show what was produced
        run: ls -lh target/package/

      - name: Inspect the deb
        run: |
          # Not a smoke test — a check that the three things a broken packaging
          # run gets wrong are actually in the archive: the control metadata, the
          # executable's mode, and the payload the desktop entry depends on.
          deb=$(ls target/package/*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          dpkg-deb --field "$deb" Depends

      - name: Inspect the rpm
        run: |
          # `Requires` here is rpmbuild's automatic dependency generator, not
          # something written down anywhere — if the ELF's `NEEDED` entries stop
          # resolving, this is where it shows.
          rpm=$(ls target/package/*.rpm)
          rpm -qip "$rpm"
          rpm -qlvp "$rpm"

      - name: Upload deb bundle
        uses: actions/upload-artifact@v7
        with:
          name: Debian bundle(${{ matrix.deb }})
          path: ${{ github.workspace }}/target/package/*.deb

      - name: Upload rpm bundle
        uses: actions/upload-artifact@v7
        with:
          name: RPM bundle(${{ matrix.rpm }})
          path: ${{ github.workspace }}/target/package/*.rpm

      - name: Upload appimage bundle
        uses: actions/upload-artifact@v7
        with:
          name: AppImage bundle(${{ matrix.appimage }})
          path: ${{ github.workspace }}/target/package/*.AppImage

  release:
    needs: [build, get-version]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && needs.get-version.outputs.app_version != needs.get-version.outputs.previous_app_version
    steps:
      - uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./release_files

      - name: Detect prerelease
        id: detect
        run: |
          if [[ "${{ needs.get-version.outputs.app_version }}" == *"alpha"* || "${{ needs.get-version.outputs.app_version }}" == *"beta"* || "${{ needs.get-version.outputs.app_version }}" == *"rc"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        id: drafter
        uses: release-drafter/release-drafter@v7
        with:
          version: ${{ needs.get-version.outputs.app_version }}
          prerelease: ${{ steps.detect.outputs.is_prerelease }}
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./release_files

      - name: Upload files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: v${{ needs.get-version.outputs.app_version }}
        run: |
          find ./release_files -type f -print0 | while IFS= read -r -d '' file; do
            echo "Uploading $file to release $TAG_NAME"
            gh release upload "$TAG_NAME" "$file" --clobber --repo conic-apps/launcher
          done