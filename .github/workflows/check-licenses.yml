name: Check licenses

on:
  push:
    paths:
      - ".github/workflows/check-licenses.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
  pull_request:
    branches: ["dev"]
    paths:
      - ".github/workflows/check-licenses.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Only the `[licenses]` check runs: vulnerability, ban and source checks
      # are deliberately left out, and `deny.toml` configures none of them. The
      # action ships the cargo-deny binary, so no Rust toolchain is needed.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
