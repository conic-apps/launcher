[workspace]
members = [
    "app/",
    "ui/",
    "crates/*",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/conic-apps/launcher"
rust-version = "1.88"

[workspace.dependencies]
# ----- local crates -----
# NOTE: local crates that aren't published to crates.io. Their version stays `0.0.0`.
conic-ui = { path = "./ui", version = "0.0.0" }
shared = { path = "./crates/shared", version = "0.0.0" }
platform = { path = "./crates/platform", version = "0.0.0" }
window = { path = "./crates/window", version = "0.0.0" }
config = { path = "./crates/config", version = "0.0.0" }
storage = { path = "./crates/storage", version = "0.0.0" }
account = { path = "./crates/account", version = "0.0.0" }
instance = { path = "./crates/instance", version = "0.0.0" }
content = { path = "./crates/content", version = "0.0.0" }
modpack = { path = "./crates/modpack", version = "0.0.0" }
modrinth = { path = "./crates/modrinth", version = "0.0.0" }
curseforge = { path = "./crates/curseforge", version = "0.0.0" }
version = { path = "./crates/version", version = "0.0.0" }
download = { path = "./crates/download", version = "0.0.0" }
install = { path = "./crates/install", version = "0.0.0" }
launch = { path = "./crates/launch", version = "0.0.0" }
java-discovery = { path = "./crates/java-discovery", version = "0.0.0" }
statistics = { path = "./crates/statistics", version = "0.0.0" }
single-instance = { path = "./crates/single-instance", version = "0.0.0" }
multiplayer = { path = "./crates/multiplayer", version = "0.0.0" }
music = { path = "./crates/music", version = "0.0.0" }
news = { path = "./crates/news", version = "0.0.0" }
tilemap = { path = "./crates/tilemap", version = "0.0.0" }
update = { path = "./crates/update", version = "0.0.0" }

# ----- non-local crates -----
slint = { version = "1.18", default-features = true }
slint-build = "1.18"
usvg = { version = "0.48", default-features = false }
symphonia = { version = "0.5", default-features = false, features = [
    "pcm",
    "wav",
    "adpcm",
    "mp3",
    "flac",
    "ogg",
    "vorbis",
    "isomp4",
    "aac",
    "alac",
] }
cpal = "0.15"
rustfft = "6.4"
glow = "0.18"
bytemuck = "1"
# `IntSize` for the borrowed-texture builder — the type Slint asks for.
euclid = "0.22"
base64 = "0.22"
chrono = "0.4"
conic-worldmap = { git="https://github.com/conic-apps/conic-worldmap", rev="a86489bb0cf12c1ce7c8a3e2b07bdb01d5c09cf7" }
env_logger = "0.11.5"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
log = "0.4"
md-5 = "0.10"
num_cpus = "1"
once_cell = "1"
os_info = "3"
rayon = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
reqwest = {version = "0.13", default-features = false, features = ["rustls", "json", "query"]} # NOTE: If it cannot parsr non-utf8 json, add charset feature
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
sha1_smol = "1"
sha2 = { version = "0.10", default-features = false }
semver = "1"
minisign-verify = "0.3"
sys-locale = "0.3"
rfd = "0.17"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
open = { version = "5", features = ["shellexecute-on-windows"] }
thiserror = "2"
toml = "1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "4", default-features = false, features = ["deflate"]}
libloader = "0.1"
tokio = { version = "1", features = ["macros", "rt", "time", "fs", "process"]}
flate2 = "1"
tar = "0.4"
fastnbt = "2"
png = "0.18"
sysinfo = "0.38"
comrak = { version = "0.18", default-features = false }
parley = "0.11"
fontique = "0.11"

[profile.dev]
incremental = true

[profile.dev.build-override]
opt-level = 2
debug = false

[profile.dev.package.conic-launcher]
debug = "line-tables-only"

[profile.dev.package.conic-ui]
debug = "line-tables-only"

# A custom background is decoded at full size and then scaled down on the UI's
# worker thread. That work — `DynamicImage::thumbnail_exact` and the codec it
# calls — is hot enough that an unoptimised debug build takes seconds on a 4K
# wallpaper: long enough that the window shows the world first and only
# cross-fades to it later, and that picking a new one feels like it did not
# take. `opt-level` alone is not enough, because the dev profile keeps
# `debug-assertions` on and the per-pixel `debug_assert!`s and overflow checks
# dominate the scale loop; both are turned off for just these crates, which
# leaves the app crate itself unoptimised and fast to rebuild.
[profile.dev.package.image]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.zune-jpeg]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.zune-core]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.png]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.gif]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.image-webp]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
