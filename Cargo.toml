[workspace]
members = [
    "app/",
    "crates/*",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/conic-apps/launcher"
rust-version = "1.88"

[workspace.dependencies]
# ----- local crates -----
# NOTE: local crates that aren't published to crates.io. Their version stays `0.0.0`.
shared = { path = "./crates/shared", version = "0.0.0" }
platform = { path = "./crates/platform", version = "0.0.0" }
window = { path = "./crates/window", version = "0.0.0" }
config = { path = "./crates/config", version = "0.0.0" }
storage = { path = "./crates/storage", version = "0.0.0" }
account = { path = "./crates/account", version = "0.0.0" }
instance = { path = "./crates/instance", version = "0.0.0" }
content = { path = "./crates/content", version = "0.0.0" }
modrinth = { path = "./crates/modrinth", version = "0.0.0" }
curseforge = { path = "./crates/curseforge", version = "0.0.0" }
version = { path = "./crates/version", version = "0.0.0" }
download = { path = "./crates/download", version = "0.0.0" }
install = { path = "./crates/install", version = "0.0.0" }
launch = { path = "./crates/launch", version = "0.0.0" }
java-discovery = { path = "./crates/java-discovery", version = "0.0.0" }
statistics = { path = "./crates/statistics", version = "0.0.0" }
single-instance = { path = "./crates/single-instance", version = "0.0.0" }
multiplayer = { path = "./crates/multiplayer", version = "0.0.0" }
music = { path = "./crates/music", version = "0.0.0" }
tilemap = { path = "./crates/tilemap", version = "0.0.0" }

# ----- non-local crates -----
slint = { version = "1.18", default-features = true }
slint-build = "1.18"
# The icon generator in `app/build.rs` parses the SVGs with the same
# `usvg` Slint's own renderer rasterizes them with, so the generated path data
# cannot disagree with what is drawn. Pinned to the version `slint` 1.18 pulls
# in (via resvg) on purpose: a second copy would drag in its own `tiny-skia`.
# `default-features = false` because the generator only reads geometry, and
# `slint` already turns on the features the union needs — leaving them on here
# would add `fontconfig-parser` and `memmap2` to the lockfile for nothing.
usvg = { version = "0.48", default-features = false }
# The background music player (crates/music). The app decodes and plays the
# tracks itself, so the decoders and the output device come from here.
# `default-features = false` keeps symphonia to a fixed set of decoders instead
# of pulling every codec in.
symphonia = { version = "0.5", default-features = false, features = [
    # `pcm` is a codec of its own, not part of `wav`: without it symphonia reads a
    # WAV header and then has no decoder for the samples it found.
    "pcm",
    "wav",
    "adpcm",
    "mp3",
    "flac",
    "ogg",
    "vorbis",
    "isomp4",
    "aac",
    "alac",
] }
cpal = "0.15"
# The spectrum analyser, mirroring the Web Audio `AnalyserNode` (crates/music/analyser.rs).
rustfft = "6.4"

# Drawing the window background's shaders on the GPU: the notifier hands over
# `get_proc_address`, and this is the loader (see app/src/ui/components/background/gl.rs).
glow = "0.18"
bytemuck = "1"
# `IntSize` for the borrowed-texture builder — the type Slint asks for.
euclid = "0.22"
base64 = "0.22"
chrono = "0.4"
conic-worldmap = { git="https://github.com/conic-apps/conic-worldmap", rev="a86489bb0cf12c1ce7c8a3e2b07bdb01d5c09cf7" }
env_logger = "0.11.5"
futures = "0.3"
# PNG for the skin textures `account` resolves and webp for the bundled
# default skins (`app/ui/assets/skins`). Slint already pulls `image` in
# for `image-default-formats`; these are the two codecs the app needs by
# name, so they are requested explicitly rather than inherited.
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
log = "0.4"
# The offline profile's UUID is the MD5 of `OfflinePlayer:<name>` (see
# `account`'s `get_uuid_from_username`), so the Rust side needs an MD5 digest.
md-5 = "0.10"
num_cpus = "1"
once_cell = "1"
os_info = "3"
rayon = "1"
regex = { version = "1", default-features = false, features = ["std"] }
reqwest = {version = "0.13", default-features = false, features = ["rustls", "json", "query"]} # NOTE: If it cannot parsr non-utf8 json, add charset feature
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
sha1_smol = "1"
sha2 = { version = "0.10", default-features = false }
sys-locale = "0.3"
thiserror = "2"
toml = "1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "4", default-features = false, features = ["deflate"]}
libloader = "0.1"
tokio = { version = "1", features = ["macros", "rt", "time", "fs"]}
flate2 = "1"
fastnbt = "2"
png = "0.18"
sysinfo = "0.38"
# The Markdown/HTML body of a content detail panel (app/src/ui/components/markdown).
# `parley` and `fontique` are the text engine Slint itself renders with, and
# they are already in the tree as Slint's own dependencies: reusing the same
# versions is not an optimisation but a requirement, because the engine is handed
# Slint's own font collection and two `fontique` versions would be two unrelated
# `Collection` types. `comrak` parses the body; `default-features = false` drops
# its `cli` (clap, xdg) and `syntect`, the latter of which would pull an oniguruma
# C library into a GUI app.
comrak = { version = "0.18", default-features = false }
parley = "0.11"
fontique = "0.11"

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
