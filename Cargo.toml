[workspace]
members = [
    "core/",
    "crates/*",
    "slint/app",
    "slint/crates/*"
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/conic-apps/launcher"
rust-version = "1.88"

[workspace.dependencies]
# ----- local crates -----
# NOTE: local crates that aren't published to crates.io. These should not have versions.
shared = { path = "./crates/shared", version = "0.0.0"}
account = { path = "./crates/account", version = "0.0.0"}
beat_this = { path = "./crates/beat_this", version = "0.0.0"}
config = { path = "./crates/config", version = "0.0.0"}
download = { path = "./crates/download", version = "0.0.0"}
folder = { path = "./crates/folder", version = "0.0.0"}
content = { path = "./crates/content", version = "0.0.0"}
curseforge = { path = "./crates/curseforge", version = "0.0.0"}
java-runtime = { path = "./crates/java-runtime", version = "0.0.0"}
install = { path = "./crates/install", version = "0.0.0"}
instance = { path = "./crates/instance", version = "0.0.0"}
modrinth = { path = "./crates/modrinth", version = "0.0.0" }
music = { path = "./crates/music", version = "0.0.0" }
multiplayer = { path = "./crates/multiplayer", version = "0.0.0" }
launch = { path = "./crates/launch", version = "0.0.0"}
platform = { path = "./crates/platform", version = "0.0.0"}
statistics = { path = "./crates/statistics", version = "0.0.0"}
update = { path = "./crates/update", version = "0.0.0"}
version = { path = "./crates/version", version = "0.0.0"}
slint = { version = "1.18", default-features = true }
slint-build = "1.18"
slint-shared = { path = "./slint/crates/shared", version = "0.0.0" }
slint-platform = { path = "./slint/crates/platform", version = "0.0.0" }
slint-window = { path = "./slint/crates/window", version = "0.0.0" }
slint-config = { path = "./slint/crates/config", version = "0.0.0" }
slint-folder = { path = "./slint/crates/folder", version = "0.0.0" }
slint-account = { path = "./slint/crates/account", version = "0.0.0" }
slint-instance = { path = "./slint/crates/instance", version = "0.0.0" }
slint-content = { path = "./slint/crates/content", version = "0.0.0" }
slint-modrinth = { path = "./slint/crates/modrinth", version = "0.0.0" }
slint-curseforge = { path = "./slint/crates/curseforge", version = "0.0.0" }
slint-version = { path = "./slint/crates/version", version = "0.0.0" }
slint-download = { path = "./slint/crates/download", version = "0.0.0" }
slint-install = { path = "./slint/crates/install", version = "0.0.0" }
slint-launch = { path = "./slint/crates/launch", version = "0.0.0" }
slint-java-runtime = { path = "./slint/crates/java-runtime", version = "0.0.0" }
slint-statistics = { path = "./slint/crates/statistics", version = "0.0.0" }
slint-single-instance = { path = "./slint/crates/single-instance", version = "0.0.0" }
slint-multiplayer = { path = "./slint/crates/multiplayer", version = "0.0.0" }
slint-markdown = { path = "./slint/crates/markdown", version = "0.0.0" }
# The loopback callback the Microsoft browser flow hands its authorization code
# to, replacing the deep link the Tauri app registers (slint/crates/authcode).
slint-authcode = { path = "./slint/crates/authcode", version = "0.0.0" }
slint-music = { path = "./slint/crates/music", version = "0.0.0" }
# The background music player (slint/crates/music). The Tauri build had the
# webview decode and play the tracks through the Web Audio API; a native app has
# to do it itself, so the decoders and the output device come from here.
# `default-features = false` keeps symphonia to the formats the player's
# extension list advertises instead of pulling every codec in.
symphonia = { version = "0.5", default-features = false, features = [
    # `pcm` is a codec of its own, not part of `wav`: without it symphonia reads a
    # WAV header and then has no decoder for the samples it found.
    "pcm",
    "wav",
    "adpcm",
    "mp3",
    "flac",
    "ogg",
    "vorbis",
    "isomp4",
    "aac",
    "alac",
] }
cpal = "0.15"
# The `AnalyserNode` of the Vue's Web Audio graph (slint/crates/music/analyser.rs).
rustfft = "6.4"

# Drawing the window background's shaders on the GPU: the notifier hands over
# `get_proc_address`, and this is the loader (see slint/app/src/background/gl.rs).
glow = "0.18"
bytemuck = "1"
# `IntSize` for the borrowed-texture builder — the type Slint asks for.
euclid = "0.22"

# ----- non-local crates -----
base64 = "0.22"
chrono = "0.4"
conic-worldmap = { git="https://github.com/conic-apps/conic-worldmap", rev="a86489bb0cf12c1ce7c8a3e2b07bdb01d5c09cf7" }
env_logger = "0.11.5"
futures = "0.3"
# PNG for the skin textures `slint-account` resolves and webp for the bundled
# default skins (`slint/app/ui/assets/skins`). Slint already pulls `image` in
# for `image-default-formats`; these are the two codecs the Slint app needs by
# name, so they are requested explicitly rather than inherited.
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
log = "0.4"
# The offline profile's UUID is the MD5 of `OfflinePlayer:<name>` (see
# `slint-account`'s `get_uuid_from_username`), so the Rust side needs the same
# digest the Vue frontend computed with `blueimp-md5`.
md-5 = "0.10"
num_cpus = "1"
once_cell = "1"
os_info = "3"
rayon = "1"
regex = { version = "1", default-features = false, features = ["std"] }
reqwest = {version = "0.13", default-features = false, features = ["rustls", "json", "query"]} # NOTE: If it cannot parsr non-utf8 json, add charset feature
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
sha1_smol = "1"
sha2 = { version = "0.10", default-features = false }
sys-locale = "0.3"
# Do NOT enable tauri's "devtools" feature here: it would force-enable devtools
# in release builds. Debug builds always have them; opt back in via core's own
# `devtools` feature when debugging production issues.
tauri = { version = "2", default-features = false, features = ["wry", "x11", "compression", "macos-private-api", "protocol-asset"] }
thiserror = "2"
toml = "1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "4", default-features = false, features = ["deflate"]}
libloader = "0.1"
tokio = { version = "1", features = ["macros", "rt", "time", "fs"]}
flate2 = "1"
fastnbt = "2"
png = "0.18"
sysinfo = "0.38"
# The Markdown/HTML body of a content detail panel (slint/crates/markdown).
# `parley` and `fontique` are the text engine Slint itself renders with, and
# they are already in the tree as Slint's own dependencies: reusing the same
# versions is not an optimisation but a requirement, because the engine is handed
# Slint's own font collection and two `fontique` versions would be two unrelated
# `Collection` types. `comrak` parses the body; `default-features = false` drops
# its `cli` (clap, xdg) and `syntect`, the latter of which would pull an oniguruma
# C library into a GUI app.
comrak = { version = "0.18", default-features = false }
parley = "0.11"
fontique = "0.11"

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
