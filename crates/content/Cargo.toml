[package]
name = "content"
description = "Saves, datapacks, resourcepacks, screenshots and mods"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
storage.workspace = true
modrinth.workspace = true
curseforge.workspace = true

base64.workspace = true
# The world map renderer (`worldmap.rs`): reads a save's region files and hands
# back an RGBA tile. The buffer goes straight to the UI, with no PNG round trip.
conic-worldmap.workspace = true
fastnbt.workspace = true
flate2.workspace = true
futures.workspace = true
log.workspace = true
once_cell.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "sync"] }
# `META-INF/mods.toml` and `META-INF/neoforge.mods.toml` (mods/forge.rs).
toml.workspace = true
zip.workspace = true
