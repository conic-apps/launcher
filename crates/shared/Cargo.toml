[package]
name = "shared"
description = "Process-wide shared helpers: the HTTP client, its proxy preference, the HTTP resource cache, and the Url extension"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
log.workspace = true
once_cell.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# `fs` for the cache's own reads and writes, `net` so the cache can resolve a
# host before deciding whether it is allowed to ask for it.
tokio = { workspace = true, features = ["fs", "net"] }
thiserror.workspace = true
url.workspace = true
