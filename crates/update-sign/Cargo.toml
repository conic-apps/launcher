[package]
name = "update-sign"
description = "Release-time signer for the launcher's update bundles"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "update-sign"
path = "src/main.rs"

[dependencies]
base64.workspace = true
# The signing half of the protocol; the app only ever pulls `minisign-verify`,
# so this crate is built on the release machine and never ships.
minisign = "0.10"
