[package]
name = "slint-content"
description = "Tauri-free mirror of crates/content for the Slint app"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
slint-folder.workspace = true
slint-modrinth.workspace = true
slint-curseforge.workspace = true

base64.workspace = true
# The world map renderer (`worldmap.rs`): reads a save's region files and hands
# back an RGBA tile. The Tauri plugin had it too; here it is used without the
# PNG round trip the webview needed.
conic-worldmap.workspace = true
fastnbt.workspace = true
flate2.workspace = true
futures.workspace = true
log.workspace = true
once_cell.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "sync"] }
# `META-INF/mods.toml` and `META-INF/neoforge.mods.toml` (mods/forge.rs).
toml.workspace = true
zip.workspace = true
