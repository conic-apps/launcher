[package]
name = "slint-download"
description = "Tauri-free mirror of crates/download for the Slint app"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
slint-config.workspace = true
slint-shared.workspace = true

futures.workspace = true
log.workspace = true
rayon.workspace = true
reqwest.workspace = true
# `rc` is what implements `Serialize`/`Deserialize` for the `Arc<Atomic…>`
# progress fields of `DownloadState`. The Tauri workspace gets it through
# feature unification with `crates/download`; the Slint app builds on its own,
# so it has to ask for it here.
serde = { workspace = true, features = ["rc"] }
serde_with.workspace = true
sha1_smol.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
