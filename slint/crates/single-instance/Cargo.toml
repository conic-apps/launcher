[package]
name = "slint-single-instance"
description = "Single-instance guard for the Slint app"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
log.workspace = true

# Platform guards, declared here rather than in the workspace table because
# each one is only ever pulled in on its own target (and because the Tauri app
# reaches for the same mechanisms through `tauri-plugin-single-instance`,
# which brings its own versions). Same convention as `slint-window`'s winit.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[target.'cfg(target_os = "macos")'.dependencies]
# Only for the uid the socket name is qualified with, so a socket of another
# user is never mistaken for ours.
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# `Win32_Security` is what `CreateMutexW` takes a `SECURITY_ATTRIBUTES` from,
# and `Win32_Graphics_Gdi` what `WNDCLASSEXW` holds its brushes and cursors in.
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
