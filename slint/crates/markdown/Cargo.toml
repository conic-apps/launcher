[package]
name = "slint-markdown"
description = "Markdown/HTML to a positioned display list, measured with Slint's own text engine"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Only for `Image`, so a decoded bitmap can travel from the caller into the
# display list. No backend and no renderer of its own: the font collection the
# measurement uses is the caller's, handed over through `Renderer::with_collection`
# (see `src/measure.rs` for why that is the right way round). Features come from
# the workspace entry rather than being set here, because cargo does not let a
# member override the inherited `default-features`.
slint.workspace = true
# CommonMark + GFM. `default-features = false` is set in the workspace entry,
# which drops `cli` (clap, xdg) and `syntect`, the latter of which would pull an
# oniguruma C library into a GUI app.
comrak.workspace = true
# The text engine Slint itself renders with, so the measurements taken here are
# the ones the renderer will reproduce. Both are already in the tree as Slint's
# own dependencies, and `fontique` has to be the *same* crate instance Slint
# uses: `Renderer::with_collection` is handed Slint's shared collection, and two
# `fontique` versions would be two unrelated `Collection` types.
parley.workspace = true
fontique.workspace = true
log.workspace = true
