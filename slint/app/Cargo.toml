[package]
# Named `conic-launcher-slint` (not `conic-shell`) to avoid clashing with the
# Tauri app's binary. Temporary until the Slint app replaces it.
name = "conic-launcher-slint"
description = "Conic Launcher app (Slint)"
version = "0.1.0-alpha.2"
edition.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
slint-build.workspace = true

[dependencies]
# `image-default-formats` adds the raster formats the OS file pickers offer
# (webp, gif, bmp, ico, …) to the decoders Slint builds in, so a picked
# background image previews in its original format like it does in the browser.
# `unstable-fontique-011` exposes `slint::fontique_011::shared_collection()`,
# which `src/cjk_font.rs` uses to name a real CJK family for the Han script
# (see that module for why the OS fallback is not enough on Windows).
slint = { workspace = true, features = ["image-default-formats", "unstable-fontique-011"] }
slint-platform.workspace = true
slint-window.workspace = true
slint-config.workspace = true
slint-folder.workspace = true
slint-account.workspace = true
slint-instance.workspace = true
slint-content.workspace = true
slint-install.workspace = true
slint-java-runtime.workspace = true
slint-single-instance.workspace = true
chrono.workspace = true
once_cell.workspace = true
# The runtime the background work runs on, standing in for Tauri's (see
# `src/runtime.rs`). Multi-threaded like Tauri's, and `net` for the HTTP client
# of `slint-install`, which reqwest turns on with its own dependency.
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }
log.workspace = true
env_logger.workspace = true

# Used to inject macOS window attributes (transparent title bar + full-size
# content view) through the winit backend's window-attributes hook.
i-slint-backend-winit = "1.18"
winit = "0.30"

# Used to position the native macOS traffic lights to match the custom title bar.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "NSNotification",
    "NSOperation",
    "NSString",
    "block2",
] }
block2 = "0.5"