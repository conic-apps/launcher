<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"
     role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Conic Launcher 技术架构</title>
  <desc id="arch-desc">Vue 3 前端通过 Tauri IPC 与 Rust core 通信，core 之下是按领域划分的 crates 模块，连接 Microsoft、Mojang、Modrinth、CurseForge 与 Yggdrasil 等外部服务。</desc>

  <defs>
    <clipPath id="arch-clip"><rect width="1200" height="520" rx="24"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6c7086"/>
    </marker>
  </defs>

  <g clip-path="url(#arch-clip)">
    <rect width="1200" height="520" fill="#11111b"/>

    <!-- frontend band -->
    <rect x="64" y="56" width="1072" height="70" rx="12" fill="#313244" stroke="#45475a" stroke-width="1"/>
    <text x="92" y="98" font-family="'PingFang SC','Segoe UI',sans-serif" font-size="20" font-weight="600" fill="#cdd6f4">前端</text>
    <text x="150" y="98" font-family="'SF Mono',Menlo,monospace" font-size="17" fill="#a6adc8">Vue 3 · Pinia · vue-i18n</text>
    <text x="1108" y="98" text-anchor="end" font-family="'PingFang SC','Segoe UI',sans-serif" font-size="17" fill="#7f849c">自定义标题栏 · 主题系统 · 全局搜索</text>

    <!-- ipc arrows -->
    <line x1="220" y1="132" x2="220" y2="176" stroke="#6c7086" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="980" y1="176" x2="980" y2="132" stroke="#6c7086" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="600" y="160" text-anchor="middle" font-family="'SF Mono',Menlo,monospace" font-size="17" fill="#a6adc8">Tauri IPC · invoke() 命令与 channel 事件</text>

    <!-- core band -->
    <rect x="64" y="186" width="1072" height="70" rx="12" fill="#313244" stroke="#45475a" stroke-width="1"/>
    <text x="92" y="228" font-family="'SF Mono',Menlo,monospace" font-size="20" font-weight="600" fill="#cdd6f4">core</text>
    <text x="160" y="228" font-family="'PingFang SC','Segoe UI',sans-serif" font-size="17" fill="#a6adc8">Tauri v2 应用 — 窗口 · 自动更新 · 深链接 · 插件注册</text>

    <!-- crates columns -->
    <g font-family="'SF Mono',Menlo,monospace" font-size="17">
      <!-- column headings -->
      <text x="64"  y="300" font-family="'PingFang SC','Segoe UI',sans-serif" font-size="18" font-weight="600" fill="#cba6f7">账户与认证</text>
      <text x="334" y="300" font-family="'PingFang SC','Segoe UI',sans-serif" font-size="18" font-weight="600" fill="#89b4fa">安装与启动</text>
      <text x="604" y="300" font-family="'PingFang SC','Segoe UI',sans-serif" font-size="18" font-weight="600" fill="#fab387">内容与实例</text>
      <text x="874" y="300" font-family="'PingFang SC','Segoe UI',sans-serif" font-size="18" font-weight="600" fill="#a6e3a1">体验与系统</text>

      <!-- col 1 chips -->
      <g fill="#313244" stroke="#45475a">
        <rect x="64"  y="316" width="99"  height="30" rx="8"/><rect x="171" y="316" width="96" height="30" rx="8"/>
        <rect x="64"  y="354" width="96"  height="30" rx="8"/><rect x="168" y="354" width="120" height="30" rx="8"/>
      </g>
      <g fill="#cdd6f4">
        <text x="113.5" y="336" text-anchor="middle">account</text><text x="219" y="336" text-anchor="middle">微软登录</text>
        <text x="112" y="374" text-anchor="middle">离线登录</text><text x="228" y="374" text-anchor="middle">Yggdrasil</text>
      </g>

      <!-- col 2 chips -->
      <g fill="#313244" stroke="#45475a">
        <rect x="334" y="316" width="89"  height="30" rx="8"/><rect x="431" y="316" width="89" height="30" rx="8"/>
        <rect x="334" y="354" width="89"  height="30" rx="8"/><rect x="431" y="354" width="110" height="30" rx="8"/>
        <rect x="334" y="392" width="150" height="30" rx="8"/>
      </g>
      <g fill="#cdd6f4">
        <text x="378.5" y="336" text-anchor="middle">install</text><text x="475.5" y="336" text-anchor="middle">version</text>
        <text x="378.5" y="374" text-anchor="middle">launch</text><text x="486" y="374" text-anchor="middle">download</text>
        <text x="409" y="412" text-anchor="middle">java-runtime</text>
      </g>

      <!-- col 3 chips -->
      <g fill="#313244" stroke="#45475a">
        <rect x="604" y="316" width="89"  height="30" rx="8"/><rect x="701" y="316" width="79" height="30" rx="8"/>
        <rect x="604" y="354" width="130" height="30" rx="8"/><rect x="742" y="354" width="110" height="30" rx="8"/>
      </g>
      <g fill="#cdd6f4">
        <text x="648.5" y="336" text-anchor="middle">modrinth</text><text x="740.5" y="336" text-anchor="middle">content</text>
        <text x="669" y="374" text-anchor="middle">curseforge</text><text x="797" y="374" text-anchor="middle">instance</text>
      </g>

      <!-- col 4 chips -->
      <g fill="#313244" stroke="#45475a">
        <rect x="874" y="316" width="140" height="30" rx="8"/>
        <rect x="874" y="354" width="79"  height="30" rx="8"/><rect x="961" y="354" width="79" height="30" rx="8"/>
        <rect x="874" y="392" width="130" height="30" rx="8"/><rect x="1012" y="392" width="79" height="30" rx="8"/>
      </g>
      <g fill="#cdd6f4">
        <text x="944" y="336" text-anchor="middle">multiplayer</text>
        <text x="913.5" y="374" text-anchor="middle">music</text><text x="1000.5" y="374" text-anchor="middle">update</text>
        <text x="939" y="412" text-anchor="middle">statistics</text><text x="1051.5" y="412" text-anchor="middle">config</text>
      </g>
    </g>

    <!-- external services footnote -->
    <line x1="64" y1="452" x2="1136" y2="452" stroke="#45475a" stroke-width="1" stroke-dasharray="4 6"/>
    <text x="600" y="486" text-anchor="middle" font-family="'PingFang SC','Segoe UI',sans-serif" font-size="17" fill="#7f849c">连接外部服务：Microsoft / Xbox · Mojang · Modrinth · CurseForge（MCIM 镜像）· Yggdrasil 认证服务器</text>
  </g>
</svg>
